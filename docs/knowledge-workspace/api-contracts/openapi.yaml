openapi: 3.1.0
info:
  title: Knowledge Workspace BFF API
  version: 1.0.0-step1
  description: |
    Browser-only, same-origin contract for Knowledge Asset Workspace V1.
    This is the Studio/BFF boundary. Connection Service and AutoSkill URLs,
    credentials, upstream IDs, and provider-native events never appear here.
servers:
  - url: /api/knowledge/v1
    description: Same-origin AgentKit Studio BFF
tags:
  - name: connectors
  - name: connections
  - name: oauth
  - name: uploads
  - name: drafts
  - name: invocations
  - name: revisions
  - name: artifacts
  - name: publications
paths:
  /connector-definitions:
    get:
      tags: [connectors]
      operationId: listConnectorDefinitions
      summary: List enabled connector definitions
      description: Returns only catalog, beta, or verified definitions enabled for this workspace.
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Connector definitions
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorDefinitionList'
        '304':
          description: Not modified
        default:
          $ref: '#/components/responses/Error'

  /connections:
    get:
      tags: [connections]
      operationId: listConnections
      summary: List connections visible to the current principal
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Connection profiles without secrets
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionList'
        '304':
          description: Not modified
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [connections]
      operationId: createConnection
      summary: Create a connection draft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectionRequest'
      responses:
        '201':
          description: Connection draft created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        default:
          $ref: '#/components/responses/Error'

  /connections/{connection_id}:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    get:
      tags: [connections]
      operationId: getConnection
      summary: Get a connection profile
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Connection profile without secrets
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '304':
          description: Not modified
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [connections]
      operationId: updateConnection
      summary: Rename or change connection visibility
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConnectionRequest'
      responses:
        '200':
          description: Updated connection
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [connections]
      operationId: revokeConnection
      summary: Revoke a connection
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Revoked (repeated calls are idempotent)
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'

  /connections/{connection_id}/validate:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    post:
      tags: [connections]
      operationId: validateConnection
      summary: Start real connection validation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidationRequest'
      responses:
        '202':
          description: Validation job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        default:
          $ref: '#/components/responses/Error'

  /connections/{connection_id}/discover:
    parameters:
      - $ref: '#/components/parameters/ConnectionId'
    post:
      tags: [connections]
      operationId: discoverConnection
      summary: Start real action/schema discovery
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoveryRequest'
      responses:
        '202':
          description: Discovery job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        default:
          $ref: '#/components/responses/Error'

  /oauth/authorize:
    post:
      tags: [oauth]
      operationId: authorizeOAuth
      summary: Configure a tenant OAuth app and start authorization
      description: |
        The BFF stores the client configuration server-side and returns a
        provider authorization URL. Client secrets are accepted only in this
        request and are never returned or persisted by the browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthAuthorizeRequest'
      responses:
        '200':
          description: Provider authorization URL and opaque polling state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorizeResponse'
        default:
          $ref: '#/components/responses/Error'

  /oauth/status:
    get:
      tags: [oauth]
      operationId: getOAuthStatus
      summary: Read the current principal's OAuth flow status
      parameters:
        - $ref: '#/components/parameters/OAuthState'
      responses:
        '200':
          description: OAuth flow status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthStatusResponse'
        default:
          $ref: '#/components/responses/Error'

  /uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Upload an isolated input file
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  type: string
                  enum: [context, skill_input]
      responses:
        '201':
          description: Upload stored in isolated object storage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        default:
          $ref: '#/components/responses/Error'

  /skills/drafts:
    get:
      tags: [drafts]
      operationId: listDrafts
      summary: List drafts in the current workspace
      parameters:
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Drafts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [drafts]
      operationId: createDraft
      summary: Create a Skill draft
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftRequest'
      responses:
        '201':
          description: Draft created
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        default:
          $ref: '#/components/responses/Error'

  /skills/drafts/{draft_id}:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    get:
      tags: [drafts]
      operationId: getDraft
      summary: Get a draft authoring workspace
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Draft
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '304':
          description: Not modified
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [drafts]
      operationId: updateDraft
      summary: Update goal, trial task, or connection bindings
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDraftRequest'
      responses:
        '200':
          description: Updated draft
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'

  /skills/drafts/{draft_id}/generate:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    post:
      tags: [drafts, invocations]
      operationId: generateDraft
      summary: Start real AutoSkill create_skill generation
      description: |
        The BFF obtains a fresh Connection lease for the selected connections,
        builds AutoSkill invocation_policy version 1 from the lease
        allowedActions, and passes it to AutoSkill as a server-only multipart
        form field. Browser responses do not expose the policy, lease, runtime
        URL, upstream IDs, or credentials.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
      responses:
        '202':
          description: Invocation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'

  /skills/drafts/{draft_id}/messages:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    post:
      tags: [drafts, invocations]
      operationId: sendDraftMessage
      summary: Update or run a draft through AutoSkill
      description: |
        For connection-backed update or trial run requests, success requires a
        successful AutoSkill request_summary with policy_evaluation.satisfied
        true and at least one matched successful execute_action whose actionId
        is in the lease-derived allowed_action_ids.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftMessageRequest'
      responses:
        '202':
          description: Invocation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'

  /skills/drafts/{draft_id}/conversation:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    get:
      tags: [drafts, invocations]
      operationId: getDraftConversation
      summary: Restore the durable ordered conversation for a draft
      description: |
        Returns browser-safe invocation metadata and normalized persisted events.
        Provider IDs, credentials, leases, internal URLs, and raw tool payloads
        are never returned.
      responses:
        '200':
          description: Ordered conversation turns and their normalized events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
        default:
          $ref: '#/components/responses/Error'

  /invocations/{invocation_id}/events:
    parameters:
      - $ref: '#/components/parameters/InvocationId'
    get:
      tags: [invocations]
      operationId: streamInvocationEvents
      summary: Stream normalized invocation events
      description: |
        SSE stream. Clients send Last-Event-ID after disconnect. A disconnect
        never changes invocation state and does not re-invoke AutoSkill.
      parameters:
        - $ref: '#/components/parameters/LastEventId'
      responses:
        '200':
          description: text/event-stream with events matching events.schema.json
          headers:
            Cache-Control:
              schema: { type: string, const: no-cache }
            Connection:
              schema: { type: string, const: keep-alive }
          content:
            text/event-stream:
              schema:
                type: string
                description: 'SSE frames: id, event, and data JSON envelope.'
        default:
          $ref: '#/components/responses/Error'

  /invocations/{invocation_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/InvocationId'
    post:
      tags: [invocations]
      operationId: cancelInvocation
      summary: Idempotently cancel an invocation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cancellation requested or already terminal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        default:
          $ref: '#/components/responses/Error'

  /skills/drafts/{draft_id}/revisions:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    get:
      tags: [revisions]
      operationId: listDraftRevisions
      summary: List immutable revisions for a draft
      responses:
        '200':
          description: Revisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [revisions]
      operationId: freezeRevision
      summary: Freeze a validated AutoSkill Skill ZIP as an immutable revision
      description: |
        This does not publish. It requires successful generation/update,
        satisfied policy evaluation, exact request_summary target_skill binding
        (skills_created for create_skill, skills_updated for update_skill), and
        ZIP validation. The BFF downloads the exact target Skill ZIP and stores
        it content-addressed. Re-freezing identical ZIP content is idempotent and
        returns the existing revision instead of fabricating a new version.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FreezeRevisionRequest'
      responses:
        '201':
          description: Immutable revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'

  /skill-revisions/{revision_id}/run:
    parameters:
      - $ref: '#/components/parameters/RevisionId'
    post:
      tags: [revisions, invocations]
      operationId: runRevision
      summary: Run one fixed revision with authorized connections
      description: |
        Runs upload the fixed revision ZIP to AutoSkill and require fresh
        Connection authorization. Success is gated by request_summary status,
        policy_evaluation.satisfied=true, skills_used/target_skill binding, and
        at least one matching successful execute_action.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRevisionRequest'
      responses:
        '202':
          description: Run accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        default:
          $ref: '#/components/responses/Error'

  /artifacts/{artifact_id}:
    parameters:
      - $ref: '#/components/parameters/ArtifactId'
    get:
      tags: [artifacts]
      operationId: getArtifact
      summary: Get immutable artifact metadata
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Artifact metadata; content is served only by the controlled artifact URL.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactResponse'
        '304':
          description: Not modified
        default:
          $ref: '#/components/responses/Error'

  /skill-revisions/{revision_id}/publish:
    parameters:
      - $ref: '#/components/parameters/RevisionId'
    post:
      tags: [publications]
      operationId: publishRevision
      summary: Publish an immutable revision to personal or team space
      description: |
        Re-runs publication gates and never mutates the revision. Publication
        binds the fixed revision digest plus the successful run's policy snapshot
        and policy_evaluation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '201':
          description: Publication created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        default:
          $ref: '#/components/responses/Error'

  /publications/{publication_id}/invoke:
    parameters:
      - $ref: '#/components/parameters/PublicationId'
    post:
      tags: [publications, invocations]
      operationId: invokePublication
      summary: Invoke a published revision for an authorized consumer
      description: |
        Starts a new AutoSkill agent_id/session_id, requires the consumer to
        reauthorize connection refs, obtains a new lease, uploads the fixed
        published Skill ZIP, and does not inherit the authoring session state or
        lease.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationInvokeRequest'
      responses:
        '202':
          description: Invocation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvocationResponse'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        default:
          $ref: '#/components/responses/Error'

components:
  parameters:
    ConnectionId:
      name: connection_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    DraftId:
      name: draft_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    InvocationId:
      name: invocation_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    RevisionId:
      name: revision_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    ArtifactId:
      name: artifact_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    PublicationId:
      name: publication_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key for retrying one side-effecting operation for at least 24 hours.
      schema: { type: string, minLength: 16, maxLength: 256 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: ETag of the resource version the client read.
      schema: { type: string, minLength: 1 }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema: { type: string }
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      description: Resume cursor. The server replays events after this ID.
      schema: { type: string }
    PageCursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    OAuthState:
      name: state
      in: query
      required: true
      description: Opaque, short-lived, one-time OAuth polling state.
      schema: { type: string, minLength: 1, maxLength: 512 }
  headers:
    ETag:
      description: Opaque strong validator for this resource representation.
      schema: { type: string, minLength: 1 }
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    IdempotencyConflict:
      description: Same idempotency key was reused with a different request fingerprint.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PreconditionFailed:
      description: ETag no longer matches.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string }
        next_cursor: { type: string }
        has_more: { type: boolean }
      additionalProperties: false
    Error:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum:
            - AUTH_REQUIRED
            - FORBIDDEN
            - WORKSPACE_NOT_FOUND
            - CONNECTION_NOT_READY
            - CONNECTION_VALIDATION_FAILED
            - LEASE_EXPIRED
            - AUTOSKILL_UNAVAILABLE
            - AUTOSKILL_PROTOCOL_ERROR
            - SKILL_ZIP_INVALID
            - ARTIFACT_UNSAFE
            - REVISION_CONFLICT
            - PUBLISH_GATE_FAILED
            - IDEMPOTENCY_CONFLICT
            - PRECONDITION_FAILED
            - NOT_FOUND
            - INVALID_ARGUMENT
            - OAUTH_PROVIDER_ERROR
            - OAUTH_COMPLETION_FAILED
            - OAUTH_TIMEOUT
        message: { type: string }
        retryable: { type: boolean }
        details: { type: object, additionalProperties: true }
      additionalProperties: false
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error: { $ref: '#/components/schemas/Error' }
        meta: { $ref: '#/components/schemas/Meta' }
      additionalProperties: false
    ConnectorDefinition:
      type: object
      required: [connector_key, version, display_name, status, capabilities, config_schema, auth_schema]
      properties:
        connector_key: { type: string }
        version: { type: string }
        display_name: { type: string }
        category: { type: string }
        status: { type: string, enum: [catalog, beta, verified] }
        capabilities:
          type: array
          items: { type: string, enum: [validate, discover, action, oauth, api_key, custom_credential, mcp, http, openapi, file] }
        config_schema: { type: object, additionalProperties: true }
        auth_schema: { type: object, additionalProperties: true }
      additionalProperties: false
    ConnectorDefinitionList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ConnectorDefinition' }
        meta: { $ref: '#/components/schemas/Meta' }
    ConnectionProfile:
      type: object
      required: [connection_id, connector_key, display_name, scope, status, definition_version, created_at, updated_at]
      properties:
        connection_id: { type: string }
        connector_key: { type: string }
        display_name: { type: string }
        scope: { type: string, enum: [personal, team] }
        status: { type: string, enum: [draft, validating, ready, degraded, error, revoked] }
        definition_version: { type: string }
        profile:
          type: object
          description: Safe account profile only; no credentials or tokens.
          additionalProperties: true
        last_validated_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    ConnectionList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ConnectionProfile' }
        meta: { $ref: '#/components/schemas/Meta' }
    ConnectionResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/ConnectionProfile' }
        meta: { $ref: '#/components/schemas/Meta' }
    CreateConnectionRequest:
      type: object
      required: [connector_key, display_name, scope, config, credential]
      properties:
        connector_key: { type: string }
        display_name: { type: string, minLength: 1, maxLength: 120 }
        scope: { type: string, enum: [personal, team] }
        config: { type: object, additionalProperties: true }
        credential:
          type: object
          description: Accepted only by BFF over TLS; never echoed or persisted in browser state.
          additionalProperties: true
      additionalProperties: false
    OAuthAuthorizeRequest:
      type: object
      required: [service, client_id, client_secret]
      properties:
        service: { type: string, minLength: 1 }
        client_id: { type: string, minLength: 1 }
        client_secret:
          type: string
          minLength: 1
          writeOnly: true
          description: Feishu App Secret; never returned or persisted in browser storage.
        connection_name: { type: string, minLength: 1, maxLength: 120 }
      additionalProperties: false
    OAuthAuthorizeResponse:
      type: object
      required: [authorizationUrl, state, connectionName]
      properties:
        authorizationUrl: { type: string, format: uri }
        state: { type: string, minLength: 1, maxLength: 512 }
        connectionName: { type: string }
      additionalProperties: false
    OAuthStatusResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [service, connectionName, status]
          properties:
            service: { type: string }
            connectionName: { type: string }
            status:
              type: string
              enum: [pending, processing, connected, provider_error, error, expired]
        meta: { $ref: '#/components/schemas/Meta' }
      additionalProperties: false
    UpdateConnectionRequest:
      type: object
      minProperties: 1
      properties:
        display_name: { type: string, minLength: 1, maxLength: 120 }
        scope: { type: string, enum: [personal, team] }
        config: { type: object, additionalProperties: true }
        credential:
          type: object
          description: Replacement credential; never echoed.
          additionalProperties: true
      additionalProperties: false
    ValidationRequest:
      type: object
      properties: { force: { type: boolean, default: false } }
      additionalProperties: false
    DiscoveryRequest:
      type: object
      properties:
        cursor: { type: string }
        limit: { type: integer, minimum: 1, maximum: 100 }
      additionalProperties: false
    JobResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [job_id, status]
          properties:
            job_id: { type: string }
            status: { type: string, enum: [queued, running, succeeded, failed] }
            event_url: { type: string }
            result: { type: object, additionalProperties: true }
            error: { type: object, additionalProperties: true }
          additionalProperties: false
        meta: { $ref: '#/components/schemas/Meta' }
    UploadResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [upload_id, filename, sha256, size_bytes]
          properties:
            upload_id: { type: string }
            filename: { type: string }
            sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
            size_bytes: { type: integer, minimum: 0 }
            media_type: { type: string }
            purpose: { type: string, enum: [context, skill_input] }
          additionalProperties: false
        meta: { $ref: '#/components/schemas/Meta' }
    Draft:
      type: object
      required: [draft_id, goal, connection_ids, lifecycle, created_at, updated_at]
      properties:
        draft_id: { type: string }
        goal: { type: string }
        trial_task: { type: string }
        connection_ids:
          type: array
          minItems: 1
          items: { type: string }
        upload_ids:
          type: array
          items: { type: string }
        lifecycle:
          type: string
          enum: [editing, generating, generated, validating, ready_to_publish, published, failed, cancelled]
        current_revision_id: { type: string }
        active_invocation_id: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      additionalProperties: false
    DraftList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Draft' } }
        meta: { $ref: '#/components/schemas/Meta' }
    DraftResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Draft' }
        meta: { $ref: '#/components/schemas/Meta' }
    CreateDraftRequest:
      type: object
      required: [goal, connection_ids]
      properties:
        goal: { type: string, minLength: 1, maxLength: 20000 }
        connection_ids: { type: array, minItems: 1, items: { type: string } }
        trial_task: { type: string, maxLength: 20000 }
        upload_ids: { type: array, items: { type: string } }
      additionalProperties: false
    UpdateDraftRequest:
      type: object
      minProperties: 1
      properties:
        goal: { type: string, minLength: 1, maxLength: 20000 }
        connection_ids: { type: array, minItems: 1, items: { type: string } }
        trial_task: { type: string, maxLength: 20000 }
        upload_ids: { type: array, items: { type: string } }
      additionalProperties: false
    GenerateRequest:
      type: object
      properties:
        model: { type: string }
        message: { type: string }
      additionalProperties: false
    DraftMessageRequest:
      type: object
      required: [message, intent]
      properties:
        message: { type: string, minLength: 1, maxLength: 20000 }
        intent: { type: string, enum: [update, run] }
        upload_ids: { type: array, items: { type: string } }
      additionalProperties: false
    Invocation:
      type: object
      required: [invocation_id, kind, status, message, event_url, created_at]
      properties:
        invocation_id: { type: string }
        kind: { type: string, enum: [generate, update, run, validate, discover] }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        message: { type: string }
        model: { type: string }
        event_url: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
      additionalProperties: false
    InvocationResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Invocation' }
        meta: { $ref: '#/components/schemas/Meta' }
    ConversationEvent:
      type: object
      required: [id, cursor, type, invocation_id, occurred_at, data]
      properties:
        id: { type: string, description: Stable semantic event ID. }
        cursor: { type: string, pattern: '^[0-9]+$', description: Durable replay cursor used by Last-Event-ID. }
        type: { type: string }
        invocation_id: { type: string }
        occurred_at: { type: string, format: date-time }
        parent_id: { type: string }
        data: { type: object, additionalProperties: true }
      additionalProperties: false
    ConversationTurn:
      type: object
      required: [invocation, events]
      properties:
        invocation: { $ref: '#/components/schemas/Invocation' }
        events:
          type: array
          items: { $ref: '#/components/schemas/ConversationEvent' }
      additionalProperties: false
    ConversationResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/ConversationTurn' }
        meta: { $ref: '#/components/schemas/Meta' }
    Revision:
      type: object
      required: [revision_id, draft_id, number, skill_name, sha256, created_at]
      properties:
        revision_id: { type: string }
        draft_id: { type: string }
        number: { type: integer, minimum: 1 }
        skill_name: { type: string }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        manifest:
          $ref: '#/components/schemas/RevisionManifest'
        created_from_invocation: { type: string }
        created_at: { type: string, format: date-time }
      additionalProperties: false
    RevisionManifest:
      type: object
      required: [kind, skill, connection_refs, allowed_action_ids, entrypoint, provenance, zip]
      properties:
        kind: { type: string, const: general }
        skill:
          type: object
          required: [name, version]
          properties:
            name: { type: string }
            version: { type: string }
          additionalProperties: false
        connection_refs:
          type: array
          items: { type: string }
          description: Server-safe connection references only; no credentials, lease, or internal URL.
        allowed_action_ids:
          type: array
          items: { type: string }
          description: Lease-derived action IDs allowed by the fixed revision.
        entrypoint: { type: string, const: SKILL.md }
        provenance:
          type: object
          description: |
            BFF revision provenance. The manifest injected into the Skill ZIP is
            smaller and contains only source, target_skill, and contract_version.
          required: [source, invocation_id, target_skill, zip_sha256]
          properties:
            source: { type: string, const: autoskill }
            invocation_id: { type: string }
            target_skill: { type: string }
            zip_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
          additionalProperties: false
        zip:
          type: object
          additionalProperties: true
      additionalProperties: false
    RevisionList:
      type: object
      required: [data, meta]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Revision' } }
        meta: { $ref: '#/components/schemas/Meta' }
    RevisionResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Revision' }
        meta: { $ref: '#/components/schemas/Meta' }
    FreezeRevisionRequest:
      type: object
      required: [invocation_id]
      properties:
        invocation_id: { type: string }
      additionalProperties: false
    RunRevisionRequest:
      type: object
      required: [connection_ids, message]
      properties:
        connection_ids: { type: array, minItems: 1, items: { type: string } }
        message: { type: string, minLength: 1, maxLength: 20000 }
        upload_ids: { type: array, items: { type: string } }
      additionalProperties: false
    Artifact:
      type: object
      required: [artifact_id, revision_id, invocation_id, media_type, sha256, created_at]
      properties:
        artifact_id: { type: string }
        revision_id: { type: string }
        invocation_id: { type: string }
        media_type: { type: string }
        encoding: { type: string }
        size_bytes: { type: integer, minimum: 1 }
        uri: { type: string }
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        title: { type: string }
        lineage: { type: object, additionalProperties: true }
        csp: { type: string }
        sandbox: { type: string }
        created_at: { type: string, format: date-time }
      additionalProperties: false
    ArtifactResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Artifact' }
        meta: { $ref: '#/components/schemas/Meta' }
    PublishRequest:
      type: object
      required: [target_space]
      properties:
        target_space: { type: string, enum: [personal, team] }
        display_name: { type: string, maxLength: 120 }
        agent_grants: { type: array, items: { type: string } }
        release_notes: { type: string, maxLength: 20000 }
      additionalProperties: false
    Publication:
      type: object
      required: [publication_id, revision_id, target_space, status, created_at]
      properties:
        publication_id: { type: string }
        revision_id: { type: string }
        target_space: { type: string, enum: [personal, team] }
        status: { type: string, enum: [published, revoked] }
        agent_grants: { type: array, items: { type: string } }
        created_at: { type: string, format: date-time }
      additionalProperties: false
    PublicationResponse:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Publication' }
        meta: { $ref: '#/components/schemas/Meta' }
    PublicationInvokeRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 20000 }
        connection_ids: { type: array, items: { type: string } }
        upload_ids: { type: array, items: { type: string } }
      additionalProperties: false
