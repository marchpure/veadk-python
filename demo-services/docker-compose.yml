services:
  demo-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-local-only
    ports: ["${KNOWLEDGE_DEMO_POSTGRES_PORT:-15432}:5432"]
    volumes: ["./postgres-init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 2s
      timeout: 2s
      retries: 20
  demo-web-action:
    image: python:3.12-slim
    command: ["python", "/srv/local_service.py", "--service", "web", "--port", "18081"]
    ports: ["${KNOWLEDGE_DEMO_WEB_PORT:-18081}:18081"]
    volumes: ["./local_service.py:/srv/local_service.py:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18081/healthz')"]
  demo-form-api:
    image: python:3.12-slim
    command: ["python", "/srv/local_service.py", "--service", "form", "--port", "18082"]
    ports: ["${KNOWLEDGE_DEMO_FORM_PORT:-18082}:18082"]
    volumes: ["./local_service.py:/srv/local_service.py:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18082/healthz')"]
  demo-mcp:
    image: python:3.12-slim
    command: ["python", "/srv/local_service.py", "--service", "mcp", "--port", "18083"]
    ports: ["${KNOWLEDGE_DEMO_MCP_PORT:-18083}:18083"]
    volumes: ["./local_service.py:/srv/local_service.py:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18083/healthz')"]
